services:
  db:
    image: ${DB_IMAGE:-mariadb:10.11}
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-mactrack-test-root}
      MARIADB_DATABASE: ${DB_NAME:-mactrack_e2e}
      MARIADB_USER: ${DB_USER:-cacti}
      MARIADB_PASSWORD: ${DB_PASSWORD:-mactrack-test}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-mactrack-test-root}
      MYSQL_DATABASE: ${DB_NAME:-mactrack_e2e}
      MYSQL_USER: ${DB_USER:-cacti}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mactrack-test}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=tcp -h 127.0.0.1 --user="$${MYSQL_USER}" --execute="SELECT 1" --silent']
      interval: 5s
      timeout: 5s
      retries: 24

  web:
    build:
      context: ${CACTI_SOURCE:?Set CACTI_SOURCE to a Cacti checkout}
      dockerfile: ${MACTRACK_SOURCE:?Set MACTRACK_SOURCE to this plugin checkout}/tests/e2e/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mactrack_e2e}
      DB_USER: ${DB_USER:-cacti}
      DB_PASS: ${DB_PASSWORD:-mactrack-test}
      TIMEZONE: UTC
    ports:
      - "${MACTRACK_E2E_PORT:-18082}:80"
    volumes:
      - ${CACTI_SOURCE}:/var/www/html/cacti
      - ../..:/var/www/html/cacti/plugins/mactrack
      - mactrack_cache:/var/www/html/cacti/cache
      - mactrack_log:/var/www/html/cacti/log
      - mactrack_rra:/var/www/html/cacti/rra
    depends_on:
      db:
        condition: service_healthy

volumes:
  mactrack_cache:
  mactrack_log:
  mactrack_rra:
