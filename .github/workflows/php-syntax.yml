name: PHP Syntax

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: php-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Show PHP version
        run: php -v

      - name: Guard against corrupted refactor patterns
        run: |
          set -euo pipefail
          if rg -n '\b(is_|in_|call_user_func_|port_list_to_|mactrack_display_|mactrack_device_action_)\[' -g '*.php' .; then
            echo "Detected corrupted call-pattern rewrite(s)." >&2
            exit 1
          fi

      - name: Lint PHP files
        run: |
          set -euo pipefail
          rg --files -g '*.php' | while IFS= read -r f; do
            php -l "$f"
          done
